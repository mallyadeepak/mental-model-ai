<title>Systems &amp; Architecture — A Field Guide</title>
<style>

    --ink:#16232A;
    --ink-muted:#52646A;
    --line:rgba(22,35,42,0.14);
    --line-strong:rgba(22,35,42,0.30);
    --accent:#0E6E86;
    --accent-ink:#FFFFFF;
    --accent-soft:rgba(14,110,134,0.10);
    --shadow:rgba(20,30,35,0.16);
    --warn:#9C4221;

    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;

  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#0A1316; --paper-raised:#101B1F; --ink:#E7EEEE; --ink-muted:#93A8AC;

      --accent:#4FD3E8; --accent-ink:#06181B; --accent-soft:rgba(79,211,232,0.12);
      --shadow:rgba(0,0,0,0.45); --warn:#F0A56B; --warn-soft:rgba(240,165,107,0.10);
      --cat-0:#3FD9BE; --cat-1:#8B9CFF; --cat-2:#E8B84F; --cat-3:#C793E8;
      --cat-4:#E87D95; --cat-5:#A8D65C; --cat-6:#7FC3E8; --cat-7:#E89A5C;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1316; --paper-raised:#101B1F; --ink:#E7EEEE; --ink-muted:#93A8AC;
    --line:rgba(180,220,225,0.14); --line-strong:rgba(180,220,225,0.30);
    --accent:#4FD3E8; --accent-ink:#06181B; --accent-soft:rgba(79,211,232,0.12);
    --shadow:rgba(0,0,0,0.45); --warn:#F0A56B; --warn-soft:rgba(240,165,107,0.10);
    --cat-0:#3FD9BE; --cat-1:#8B9CFF; --cat-2:#E8B84F; --cat-3:#C793E8;
    --cat-4:#E87D95; --cat-5:#A8D65C; --cat-6:#7FC3E8; --cat-7:#E89A5C;
  }
  :root[data-theme="light"]{
    --paper:#F2F5F1; --paper-raised:#FFFFFF; --ink:#16232A; --ink-muted:#52646A;
    --line:rgba(22,35,42,0.14); --line-strong:rgba(22,35,42,0.30);
    --accent:#0E6E86; --accent-ink:#FFFFFF; --accent-soft:rgba(14,110,134,0.10);
    --shadow:rgba(20,30,35,0.16); --warn:#9C4221; --warn-soft:rgba(156,66,33,0.09);
    --cat-0:#0E7C6B; --cat-1:#4A5FC1; --cat-2:#A6720E; --cat-3:#7B4AA6;
    --cat-4:#A6314A; --cat-5:#5A7A1E; --cat-6:#2F6690; --cat-7:#A65A2E;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:var(--font-sans);
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--line) 0px, var(--line) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--line) 0px, var(--line) 1px, transparent 1px, transparent 28px);
    background-attachment:fixed;
    display:flex; flex-direction:column; min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important; scroll-behavior:auto !important;}
  }
  a{color:inherit;}
  button{font-family:inherit; color:inherit;}

  /* ---------- Header ---------- */
  .hero{
    padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 18px;
    border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:14px;
  }
  .hero-top{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px;}
  .hero-title{
    font-family:var(--font-serif); font-weight:400;
    font-size:clamp(26px,3.6vw,38px); line-height:1.1; margin:0;
    text-wrap:balance;
  }
  .hero-sub{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.04em;
    color:var(--ink-muted); text-transform:uppercase; margin-top:6px;
  }
  .hero-stats{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted);
    letter-spacing:.03em; white-space:nowrap;
  }
  .hero-controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .search-box{position:relative; width:min(360px,60vw);}
  .search-input{
    width:100%; font-family:var(--font-mono); font-size:13px;
    padding:9px 12px; border:1px solid var(--line-strong); border-radius:3px;
    background:var(--paper-raised); color:var(--ink); outline:none;
  }
  .search-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .reset-btn{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.03em;
    background:transparent; border:1px solid var(--line-strong); border-radius:3px;
    padding:9px 12px; cursor:pointer; color:var(--ink-muted);
  }
  .reset-btn:hover{color:var(--ink); border-color:var(--ink-muted);}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30;
    background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:4px;
    box-shadow:0 8px 24px var(--shadow); max-height:320px; overflow-y:auto; display:none;
  }
  .search-results.open{display:block;}
  .search-result{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover, .search-result.active{background:var(--accent-soft);}
  .sr-label{font-size:13.5px; font-weight:600;}
  .sr-path{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); margin-top:2px;}
  .sr-empty{padding:12px; font-size:12.5px; color:var(--ink-muted);}

  /* ---------- Breadcrumb ---------- */
  .breadcrumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:6px;
    padding:10px clamp(16px,4vw,40px); border-bottom:1px solid var(--line);
    font-family:var(--font-mono); font-size:12px; background:var(--paper);
    min-height:20px;
  }
  .crumb{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none;
    cursor:pointer; padding:3px 6px; border-radius:3px; color:var(--ink-muted);
  }
  .crumb:hover{background:var(--accent-soft); color:var(--ink);}
  .crumb.current{color:var(--ink); font-weight:600;}
  .crumb-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .crumb-sep{color:var(--ink-muted); opacity:.6;}

  /* ---------- Board (Miller columns) ---------- */
  .board{
    flex:1; display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-behavior:smooth; min-height:0;
  }
  .column{
    flex:0 0 300px; max-width:300px; border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; background:var(--paper);
  }
  @media (max-width:640px){
    .column{flex:0 0 88vw; max-width:88vw; scroll-snap-align:start;}
    .board{scroll-snap-type:x mandatory;}
  }
  .column-head{
    position:sticky; top:0; z-index:2; background:var(--paper);
    padding:10px 14px; border-bottom:1px solid var(--line);
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-muted); display:flex;
    justify-content:space-between; gap:8px;
  }
  .column-list{flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px;}

  .card{
    position:relative; text-align:left; background:var(--paper-raised);
    border:1px solid var(--line); border-left:4px solid var(--cat, var(--accent));
    border-radius:2px; padding:10px 12px 10px 12px; cursor:pointer;
    display:flex; flex-direction:column; gap:4px;
  }
  .card::before, .card::after{
    content:""; position:absolute; width:7px; height:7px; border-color:var(--cat, var(--accent));
    opacity:.55;
  }
  .card::before{ top:-1px; right:-1px; border-top:1.5px solid; border-right:1.5px solid; }
  .card::after{ bottom:-1px; right:-1px; border-bottom:1.5px solid; border-right:1.5px solid; }
  .card:hover{border-color:var(--line-strong); background:var(--accent-soft);}
  .card.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent);}
  .card-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .card-label{font-size:14px; font-weight:600; line-height:1.3;}
  .card-chevron{font-family:var(--font-mono); color:var(--ink-muted); font-size:13px; flex-shrink:0;}
  .card-blurb{font-size:12px; color:var(--ink-muted); line-height:1.4;}

  .column-empty{padding:16px 14px; font-size:12.5px; color:var(--ink-muted); font-style:italic;}

  /* ---------- Detail drawer ---------- */
  .drawer{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--paper-raised); border-top:1px solid var(--line-strong);
    box-shadow:0 -12px 32px var(--shadow); max-height:46vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .22s ease;
  }
  .drawer.open{transform:translateY(0);}
  .drawer-inner{max-width:820px; margin:0 auto; padding:20px clamp(16px,4vw,36px) 32px;}
  .drawer-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:10px;}
  .drawer-tag{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono);
    font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted);
    margin-bottom:8px;
  }
  .drawer-dot{width:8px; height:8px; border-radius:50%; background:var(--cat,var(--accent));}
  .drawer-title{font-family:var(--font-serif); font-size:clamp(20px,3vw,27px); margin:0; text-wrap:balance;}
  .drawer-close{
    background:none; border:1px solid var(--line-strong); border-radius:50%;
    width:30px; height:30px; font-size:16px; line-height:1; cursor:pointer; flex-shrink:0;
    color:var(--ink-muted);
  }
  .drawer-close:hover{color:var(--ink); border-color:var(--ink-muted);}
  .drawer-desc{font-family:var(--font-serif); font-size:16px; line-height:1.55; max-width:65ch; margin:0 0 16px;}
  .drawer-box{border-left:3px solid var(--cat,var(--accent)); padding:4px 0 4px 14px; margin-bottom:14px;}
  .drawer-box.analogy{font-family:var(--font-serif); font-style:italic; font-size:15px; line-height:1.5;}
  .drawer-box-label{
    display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-muted); margin-bottom:5px; font-style:normal;
  }
  .drawer-box.why{border-left-color:var(--accent); background:var(--accent-soft); padding:10px 14px; border-radius:0 3px 3px 0;}
  .drawer-box.why p{margin:0; font-size:14.5px; line-height:1.5;}
  .drawer-box.pitfall{border-left-color:var(--warn); background:var(--warn-soft); padding:10px 14px; border-radius:0 3px 3px 0;}
  .drawer-box.pitfall p{margin:0; font-size:14.5px; line-height:1.5;}
  .drawer-box.pitfall .drawer-box-label{color:var(--warn);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
const DATA = [
  {
    id:'scalability', label:'Scalability & Performance', hue:0,
    blurb:'Making systems handle more without falling over.',
    description:`Scalability is not about handling today's load — it's about knowing which axis breaks first as load grows 10x, and paying for that axis deliberately rather than everywhere at once.`,
    children:[
      {
        id:'load-balancing', label:'Load Balancing',
        blurb:'Spreading requests so no single instance drowns.',
        description:`A load balancer sits between clients and a fleet of servers, choosing which instance handles each request. The interesting engineering is in how it chooses, and what it does when an instance is unhealthy.`,
        analogy:`A maître d' who seats parties across every open table instead of filling table one until it's overloaded — and quietly stops seating anyone at a table that just caught fire.`,
        why:`Load balancer choice determines your blast radius during partial outages and your ceiling for connection-heavy protocols like WebSockets or gRPC streams.`,
        children:[
          { id:'l4-vs-l7', label:'L4 vs L7 Balancing', blurb:'Routing on packets vs routing on content.',
            description:`Layer 4 balancers route by IP/port without inspecting payload — fast and protocol-agnostic, but blind. Layer 7 balancers terminate TLS and read HTTP headers/paths, enabling routing by URL and cookie-based affinity — at the cost of CPU and an extra hop for TLS termination.`,
            why:`Choosing L7 for internal service mesh traffic buys you retries and circuit breaking; choosing L4 for a TCP-heavy workload avoids paying a decryption tax twice.`,
            pitfall:`Terminating TLS at an L7 balancer and forgetting to re-encrypt to the backend leaves internal traffic in plaintext — a common audit finding.` },
          { id:'lb-algorithms', label:'Load Balancing Algorithms', blurb:'Round robin, least-connections, consistent hashing.',
            description:`Round robin assumes every request costs the same; least-connections adapts to uneven request cost; consistent hashing routes the same key to the same backend, trading perfect balance for cache locality.`,
            analogy:`Consistent hashing is like assigning regular customers to the same barista every time — you lose perfectly even queues but gain "they already know my order."`,
            why:`Picking consistent hashing for a caching layer can cut cache-miss rate dramatically; picking it for a CPU-bound workload can create hot spots.` },
          { id:'health-checks', label:'Health Checks & Draining', blurb:'Removing sick instances without dropping in-flight work.',
            description:`Health checks decide when to stop routing new traffic to an instance; connection draining lets in-flight requests finish before an instance is terminated during a deploy or scale-down.`,
            why:`Skipping graceful draining is the single most common cause of a "clean" deploy producing a spike of 5xx errors.`,
            pitfall:`A health check that only pings "/health" — not a real dependency check — will happily route traffic to an instance whose database connection pool is exhausted.` }
        ]
      },
      {
        id:'caching', label:'Caching Strategies',
        blurb:'Trading staleness for speed, deliberately.',
        description:`Every cache is a bet that recomputing is more expensive than occasionally serving stale data. The strategy determines who pays the cost of a miss, and how stale "stale" is allowed to get.`,
        analogy:`A restaurant keeping a tray of pre-made appetizers out front: faster to serve, but someone has to notice when the recipe changes and refresh the tray.`,
        why:`Cache invalidation bugs are disproportionately expensive because they're silent — the system looks fine while serving wrong answers.`,
        children:[
          { id:'cache-write-patterns', label:'Cache-Aside vs Write-Through vs Write-Behind', blurb:'Who updates the cache, and when.',
            description:`Cache-aside: the app reads the cache and, on a miss, loads from the source and populates it — simple, but leaves a window of staleness. Write-through: writes hit the cache and source together — consistent, but every write pays cache latency. Write-behind: writes hit the cache and flush to the source asynchronously — fast, but a crash can lose unflushed data.`,
            why:`Write-behind is the one principal engineers should scrutinize hardest in design review — it quietly converts a durability guarantee into a best-effort one.` },
          { id:'cdn-edge', label:'CDN & Edge Caching', blurb:'Moving the cache close to the user.',
            description:`A CDN caches responses at points of presence near the user, cutting round-trip latency and origin load for anything cacheable — static assets, and increasingly personalized-but-cacheable API responses via edge compute.`,
            why:`The hard part isn't caching the cacheable 80% — it's drawing the line for the 20% that looks cacheable but has a hidden per-user dependency: auth state, feature flags, locale.` },
          { id:'cache-invalidation', label:'Cache Invalidation', blurb:'"There are only two hard things in Computer Science."',
            description:`TTL-based expiry is simple but arbitrary. Event-based invalidation is precise but requires every writer to remember to fire the event. Versioned, content-hashed cache keys sidestep invalidation entirely by never overwriting a key.`,
            why:`The most reliable invalidation strategy is usually the one that requires no human or service to remember to do anything — key-by-content-hash beats "remember to invalidate."` }
        ]
      },
      {
        id:'scale-axis', label:'Horizontal vs Vertical Scaling',
        blurb:'Bigger boxes vs more boxes.',
        description:`Vertical scaling — a bigger machine — is operationally simple with a hard ceiling. Horizontal scaling — more machines — is operationally complex, demanding statelessness and coordination, but scales without a ceiling.`,
        analogy:`Vertical scaling is hiring one genius who works faster; horizontal scaling is hiring a team — which only works if the work is actually divisible and the team doesn't spend all its time coordinating.`,
        why:`The prerequisite question isn't "can we add more servers" — it's "does this service hold any state a request depends on being on THIS server." That answer decides the whole scaling roadmap.`,
        children:[
          { id:'statelessness', label:'Statelessness as a Prerequisite', blurb:"You can't horizontally scale what remembers you.",
            description:`A service can only be freely load-balanced across instances if any instance can handle any request — meaning session state, in-memory caches, and sticky connections all have to move to a shared store or become irrelevant.`,
            pitfall:`In-memory rate limiters and in-memory feature-flag caches are the two most common accidental sources of hidden state that break horizontal scaling silently.` },
          { id:'sharding-partitioning', label:'Sharding & Partitioning', blurb:'Splitting data so no single node holds it all.',
            description:`Sharding splits a dataset across nodes by a partition key, so each node holds a manageable slice. Done well, most queries hit exactly one shard; done poorly, most queries fan out to all of them, and you've paid the complexity cost without the benefit.`,
            why:`Choosing the shard key is the single highest-leverage decision in a sharded system — expensive to change later, and it decides which query patterns stay fast forever.` }
        ]
      },
      {
        id:'async-processing', label:'Asynchronous Processing & Backpressure',
        blurb:"Decoupling how fast work arrives from how fast it's done.",
        description:`Queues let producers and consumers run at different speeds. Backpressure is the mechanism that stops a slow consumer from being silently overwhelmed — or worse, from silently dropping work.`,
        analogy:`A queue is a to-go counter: orders pile up in a visible line instead of the kitchen trying to cook everything at once and burning it all.`,
        why:`A system with no backpressure doesn't fail gracefully under load — it fails invisibly, falling further behind until someone notices a queue is now six hours deep.`,
        children:[
          { id:'backpressure-signaling', label:'Backpressure Signaling', blurb:'Telling upstream to slow down before you fall over.',
            description:`Backpressure can be explicit — a consumer returns a "slow down" signal, like TCP flow control or a 429 — or implicit, where a queue simply grows and something else has to notice and act on its depth.`,
            why:`Systems without explicit backpressure push the problem downstream until it becomes a customer-facing outage instead of an internal metric.` },
          { id:'batching', label:'Batching', blurb:'Trading latency for throughput, on purpose.',
            description:`Grouping many small units of work into one larger operation amortizes fixed overhead — a network round trip, a disk fsync, a lock acquisition — at the cost of the first item in the batch waiting for the rest.`,
            why:`Batching improves both cost and throughput at once; the trade-off is entirely in tail latency, so it belongs on the read path only when the SLA allows it.` }
        ]
      }
    ]
  },
  {
    id:'distributed', label:'Distributed Systems Foundations', hue:1,
    blurb:"The physics of computers that don't share memory or a clock.",
    description:`These are the constraints you cannot engineer your way out of — only choose which one you violate least badly for your use case.`,
    children:[
      { id:'cap-theorem', label:'CAP Theorem & PACELC', blurb:"You can't have all three during a partition — and the trade-off exists even without one.",
        description:`CAP says that during a network partition, a distributed system must choose between Consistency (every read sees the latest write) and Availability (every request gets a response). PACELC extends this: even absent a partition, there's still a Latency vs Consistency trade-off, because keeping replicas consistent takes coordination time.`,
        analogy:`Two people updating the same shared shopping list on paper, in different rooms, with no way to talk right now: stop writing until they can compare notes (consistent, unavailable), or keep writing and reconcile the conflict later (available, inconsistent).`,
        why:`CAP isn't a menu you pick from once — most real systems make the choice differently for different data: strongly consistent for account balances, eventually consistent for view counts, within the same architecture.` },
      { id:'consistency-models', label:'Consistency Models', blurb:"How stale is 'stale,' precisely?",
        description:`Strong consistency guarantees every reader sees the latest write immediately. Eventual consistency guarantees agreement eventually, with no bound on when. Causal consistency guarantees causally related events are seen in order, even if unrelated events aren't. Read-your-writes guarantees a user always sees their own recent write, even under a weaker global model.`,
        analogy:`Read-your-writes is like a text message you sent showing up in your own chat window instantly, even if it takes a few seconds to reach the other person.`,
        why:`Read-your-writes is the cheapest consistency guarantee to add and the one users notice fastest when it's missing — "I just posted this, why isn't it showing?" is a support-ticket generator.` },
      { id:'consensus', label:'Consensus Algorithms', blurb:'Getting a set of unreliable machines to agree on one truth.',
        description:`Paxos and Raft solve the same problem — electing a leader and replicating a log so a majority of nodes agree on the order of operations, surviving the failure of a minority. Raft trades some of Paxos's generality for being explainable and implementable correctly.`,
        analogy:`A quorum vote in a committee where the chair can be replaced mid-meeting, but the minutes everyone already agreed to can never be rewritten.`,
        why:`You'll rarely implement Raft yourself, but recognizing "this is leader election + replicated log" tells you to reach for ZooKeeper/etcd/Raft-backed stores instead of hand-rolling a fragile lock.`,
        children:[
          { id:'quorums', label:'Quorums & Majorities', blurb:"Why 'more than half' is the magic number.",
            description:`Requiring a majority — not all nodes — to agree means the system tolerates the failure of a minority while guaranteeing any two majorities overlap in at least one node, which is what prevents two conflicting decisions from both being "committed."`,
            why:`This is why odd-numbered clusters (3, 5, 7) are conventional: they maximize fault tolerance per node added, since 4 nodes tolerate the same 1 failure as 3, just for the cost of an extra machine.` },
          { id:'split-brain', label:'Leader Election & Split Brain', blurb:'What happens when two nodes both think they\'re in charge.',
            description:`A network partition can cause two sides of a cluster to each elect their own leader — "split brain" — leading to two nodes both accepting writes that will conflict. Consensus protocols prevent this by requiring leader legitimacy to be backed by a quorum, not just self-declaration.`,
            pitfall:`Homegrown "leader election" via a database row lock without a lease or fencing token is a classic split-brain bug waiting for the right network hiccup.` }
        ]
      },
      { id:'idempotency', label:'Idempotency', blurb:"Making 'do it again' safe.",
        description:`An idempotent operation produces the same result no matter how many times it's applied. In distributed systems, retries are inevitable — the network can't tell you whether your request succeeded or the response was lost — so idempotency is what makes retrying safe instead of dangerous.`,
        analogy:`An elevator call button: pressing it five times because you're not sure it registered doesn't summon five elevators.`,
        why:`"Exactly-once" delivery doesn't really exist across a network — what you can build is at-least-once delivery plus idempotent processing, which behaves like exactly-once from the caller's point of view.`,
        pitfall:`A payment API without an idempotency key will double-charge a customer the moment a client retries a timed-out request that actually succeeded server-side.` },
      { id:'logical-time', label:'Ordering & Logical Time', blurb:"When there's no shared clock, what does 'before' even mean?",
        description:`Physical clocks drift and can't be perfectly synchronized across machines. Lamport timestamps give a total order consistent with causality; vector clocks go further, letting you detect when two events are truly concurrent rather than falsely ordering them.`,
        analogy:`Reconstructing the order of two unrelated text conversations from timestamps on phones with slightly different clocks — you need reply-to threading, not just the clock, to know what really came first.`,
        why:`Systems that assume wall-clock time is a reliable ordering signal — "last write wins" by timestamp — will silently corrupt data whenever clocks drift, which they always eventually do.` }
    ]
  },
  {
    id:'data', label:'Data Architecture', hue:2,
    blurb:'Where the truth lives, and how many copies of it there are.',
    description:`Data architecture decisions are the hardest to reverse in a system — migrating a data model under live traffic is where most "quick fixes" turn into year-long projects.`,
    children:[
      { id:'sql-vs-nosql', label:'SQL vs NoSQL Trade-offs', blurb:'Schema-on-write vs schema-on-read, and what you give up.',
        description:`Relational databases give strong consistency, joins, and engine-enforced constraints — at the cost of a rigid schema and harder horizontal scaling. NoSQL stores trade those guarantees for flexible schemas and scale-out designed in from the start.`,
        analogy:`SQL is a strict librarian who enforces the card-catalog rules on every book that comes in; NoSQL is a warehouse that'll take anything you hand it and let you sort out the organization later.`,
        why:`The real question is never "SQL or NoSQL" in the abstract — it's which access patterns need joins and constraints, and which need horizontal write scale. Often the honest answer is both, for different data.` },
      { id:'acid-vs-base', label:'ACID vs BASE', blurb:'Guaranteed correctness vs guaranteed availability.',
        description:`ACID (Atomicity, Consistency, Isolation, Durability) guarantees a transaction either fully happens or fully doesn't, without corrupting concurrent transactions. BASE (Basically Available, Soft state, Eventual consistency) relaxes those guarantees for availability and scale.`,
        why:`Money, inventory counts, and anything with a legal or audit requirement almost always belong on the ACID side — the operational cost of eventual consistency in a ledger is reconciliation work that never ends.` },
      { id:'event-sourcing', label:'Event Sourcing & CQRS', blurb:'Storing what happened, not just the current state.',
        description:`Event sourcing stores an append-only log of every state-changing event rather than overwriting a row — current state is derived by replaying events. CQRS splits the write model (events) from read models optimized for specific queries, rebuilt from the event log.`,
        analogy:`A bank ledger, not a bank balance: the balance is always derivable by replaying every transaction, and you can build a completely different report from the same source of truth without touching how transactions are recorded.`,
        why:`Event sourcing gives a perfect audit trail and the ability to add read models retroactively — but it moves complexity from "update a row" to "manage the schema evolution of events forever," a real, ongoing cost.`,
        pitfall:`Teams adopt event sourcing for the audit trail and then discover the hard part is versioning event schemas as business logic evolves over years, not the initial implementation.` },
      { id:'cdc-streaming', label:'Change Data Capture & Streaming', blurb:"Turning database writes into a stream other systems can react to.",
        description:`CDC tails a database's write-ahead log and emits each change as an event, letting downstream systems stay in sync without dual writes from the application. Log-based systems like Kafka make that stream durable, replayable, and fan out to many consumers.`,
        analogy:`Instead of every department calling the warehouse to ask "did anything change," the warehouse broadcasts every shipment over a PA system, and each department listens for what it cares about.`,
        why:`CDC eliminates "dual write" bugs — where an app writes to the database and separately to a search index, and a crash between the two leaves them permanently out of sync.` },
      { id:'partition-key', label:'Partitioning & Sharding Strategy', blurb:'Choosing the key that decides where every row lives.',
        description:`The partition key determines which node a piece of data lives on. A good key spreads storage and query load evenly; a bad one creates a "hot partition" hammered while the rest of the cluster idles.`,
        why:`Resharding a live system with a bad key is one of the most expensive rescue projects in a company's history — get this right up front, or budget a quarter to fix it later.`,
        pitfall:`Partitioning a multi-tenant system by tenant ID feels natural until one enterprise customer's traffic dwarfs every small customer combined, creating a hot partition no amount of horizontal scaling fixes.` }
    ]
  },
  {
    id:'architecture', label:'Architecture Styles & Principles', hue:3,
    blurb:'How you draw the boundaries between the parts.',
    description:`Style debates — monolith vs microservices, REST vs gRPC — are really debates about where complexity should live: inside a process, or in the network between processes.`,
    children:[
      { id:'monolith-vs-micro', label:'Monolith vs Microservices vs Modular Monolith', blurb:'Where you pay the coordination tax.',
        description:`A monolith keeps coordination in-process — fast and simple, until the codebase or team outgrows it. Microservices move boundaries to the network, enabling independent deployment and scaling at the cost of distributed-systems complexity for every interaction. A modular monolith keeps deployment simple while enforcing microservice-like module boundaries in code — often the better default.`,
        analogy:`A monolith is one big kitchen where every cook can grab any ingredient instantly; microservices are food trucks that each own their ingredients but now have to radio each other and hope the message arrives.`,
        why:`Split by team boundaries and independent scaling needs, not by a belief that microservices are inherently "more scalable" — a monolith with good module boundaries usually outperforms a poorly decomposed microservice mesh.`,
        pitfall:`Splitting into microservices before the team is big enough to own them independently just distributes a monolith's coupling over a network, adding latency and failure modes without removing the coordination cost.` },
      { id:'ddd', label:'Domain-Driven Design', blurb:'Modeling the business, not the database.',
        description:`DDD organizes software around bounded contexts — explicit boundaries where a particular model and vocabulary apply consistently, even if the same word means something different elsewhere. Aggregates are the consistency boundary within a context — the unit you can update atomically.`,
        analogy:`"Customer" means something different to Sales (a lead with a budget) and Support (an account with a ticket history) — DDD says stop forcing one shared table to serve both, and give each context its own model.`,
        why:`Bounded contexts are the natural seams for microservice boundaries — splitting along them keeps each service's model coherent; splitting across them produces "distributed monolith" services that must always change together.` },
      { id:'hexagonal', label:'Hexagonal / Clean Architecture', blurb:'Keeping business logic ignorant of the database and the framework.',
        description:`Ports & adapters architecture puts business logic at the center, depending only on abstract interfaces ("ports"). Databases, queues, and web frameworks are "adapters" plugged in from the outside, so the core can be tested without a real database and the framework can be swapped without touching business rules.`,
        analogy:`An electrical outlet doesn't care whether a lamp or a laptop charger is plugged into it — the wiring behind the wall stays the same regardless of what's plugged in.`,
        why:`This is the difference between a codebase where you can unit-test business rules in milliseconds with no database, and one where every test needs a running Postgres — that difference compounds into hours of CI time over a project's life.` },
      { id:'event-driven', label:'Event-Driven Architecture', blurb:'Services that react to what happened, instead of asking what to do.',
        description:`In choreography, each service listens for events and decides its own next action — no central coordinator, but the flow is implicit. In orchestration, a central process explicitly directs each step — easier to observe, but reintroduces a central point of coordination.`,
        analogy:`Choreography is a flock of birds turning in formation with no leader; orchestration is a conductor calling out cues to a section of the orchestra one at a time.`,
        why:`Choreography scales team autonomy better; orchestration trades that autonomy for a diagram that actually matches reality — which one you need depends on whether you can currently answer "what happens when a customer places an order" without archaeology.`,
        pitfall:`Sagas that coordinate a multi-step distributed transaction need explicit compensating actions for every step — teams that build the happy path and skip compensation discover it during their first real partial failure, in production.` },
      { id:'api-design', label:'API Design Philosophy', blurb:'REST vs gRPC vs GraphQL is a contract-evolution decision, not a taste decision.',
        description:`REST models resources over HTTP and is universally supported but under-specifies contracts. gRPC uses strongly-typed protobuf contracts and HTTP/2 multiplexing — fast and precise, but needs more tooling. GraphQL lets clients specify exactly the data shape they want, cutting over/under-fetching, at the cost of simple, cacheable, fixed-shape endpoints.`,
        why:`What matters long-term is contract evolution: how a producer adds a field without breaking every consumer, and how you know it's safe to remove one. Protobuf field numbering and GraphQL deprecation directives solve this explicitly; REST usually relies on convention and discipline alone.` }
    ]
  },
  {
    id:'reliability', label:'Reliability & Operability', hue:4,
    blurb:"Staying up, and knowing when you're about to not be.",
    description:`Reliability engineering assumes failure is normal, and designs the system — and the team's response to it — around that assumption.`,
    children:[
      { id:'observability', label:'Observability', blurb:'Metrics, logs, and traces — three different questions about the same event.',
        description:`Metrics answer "how much / how often," cheaply and aggregated (good for alerting). Logs answer "what exactly happened" for one instance (good for debugging). Traces answer "where did the time go" across services for one request (good for finding the slow hop).`,
        analogy:`Metrics are a car's speedometer — a number, always available. Logs are the trip's full diary entry. A trace is the GPS breadcrumb trail showing exactly which roads were slow today.`,
        why:`Teams with only logs can't answer "is this getting worse" without grepping; teams with only metrics can't answer "which specific request failed and why." You need all three, plus discipline on metric cardinality.` },
      { id:'slo-error-budget', label:'SLIs, SLOs, SLAs & Error Budgets', blurb:"Turning 'be reliable' into a number you can manage against.",
        description:`An SLI is a measured metric, like "% of requests under 300ms." An SLO is the internal target, like "99.9% over 30 days." An SLA is the external, often contractual, promise — usually looser than the SLO for margin. The error budget is 100% minus the SLO: the unreliability you're allowed to spend on risk, like shipping fast.`,
        why:`An error budget reframes "reliability vs velocity" from a values debate into a math problem — budget left, ship faster; budget burned, freeze features and fix reliability. It's the single most useful tool for ending that argument with data instead of opinions.` },
      { id:'failure-isolation', label:'Failure Isolation', blurb:"Stopping one broken dependency from taking down everything that calls it.",
        description:`A circuit breaker stops calling a dependency that's clearly failing, failing fast instead of piling up slow timeouts. A bulkhead partitions resources per dependency so one slow one can't starve requests to a healthy one. Retries with jitter avoid every client retrying in lockstep and re-creating the overload.`,
        analogy:`Bulkheads are literally named after ship compartments — flooding in one shouldn't sink the whole ship, and the same idea applies to thread pools and connection pools.`,
        why:`Most cascading outages aren't caused by the original failure — they're caused by everything upstream retrying it simultaneously without jitter or a breaker, turning a 30-second blip into a 2-hour incident.` },
      { id:'chaos-degradation', label:'Graceful Degradation & Chaos Engineering', blurb:'Failing on purpose, on your own schedule, to learn how it fails on its own.',
        description:`Graceful degradation designs explicit fallback behavior when a dependency is down — cached recommendations instead of no recommendations — rather than an undefined failure. Chaos engineering deliberately injects failures in a controlled way to verify fallbacks actually work, instead of discovering they don't during a real incident.`,
        why:`A fallback path that's never exercised is a fallback path that doesn't work — the only way to know your circuit breaker or degraded mode functions is to trigger it deliberately before production does it for you at 3am.` },
      { id:'deployment-strategy', label:'Deployment Strategies', blurb:"Rolling out change without betting the whole fleet on it.",
        description:`Blue-green keeps two full environments and switches traffic atomically — instant rollback, double the infrastructure cost. Canary sends a small percentage of real traffic to the new version, watching metrics before full rollout. Feature flags decouple deployment from release entirely — code ships dark and is turned on for a cohort independently of the deploy.`,
        why:`Feature flags are the highest-leverage tool here — they separate "did the deploy work" from "does the feature work for users," so a bad feature can be turned off in seconds without a rollback.` }
    ]
  },
  {
    id:'security', label:'Security Architecture', hue:5,
    blurb:'Assuming someone is already inside the walls.',
    description:`Modern security architecture assumes breach is a when, not an if, and designs so a single compromised credential or service doesn't cascade into a full compromise.`,
    children:[
      { id:'authn-authz', label:'AuthN vs AuthZ', blurb:'Who are you, vs what are you allowed to do.',
        description:`Authentication proves identity — a password, a token, a certificate. Authorization decides what an authenticated identity can do. OAuth2 delegates authorization; OIDC layers identity on top of it.`,
        why:`Conflating the two is a classic vulnerability: an API that checks "is this token valid" but forgets "is this user allowed to access this specific resource" is how one user reads another user's private data by changing an ID in the URL.` },
      { id:'zero-trust', label:'Zero Trust & Defense in Depth', blurb:'Never trust a request just because it came from inside the network.',
        description:`The older model trusted anything inside the perimeter implicitly. Zero trust verifies every request's identity and authorization regardless of network location. Defense in depth layers multiple independent controls so a single failure isn't enough to fully compromise the system.`,
        analogy:`A zero-trust building doesn't just check your badge at the front door and trust you everywhere inside — every sensitive room has its own reader, because the front-door badge only proves you got past the front door.`,
        why:`Perimeter-only security fails catastrophically once any single internal service is compromised, because everything inside was implicitly trusted — zero trust contains that compromise to one hop instead of the whole network.` },
      { id:'secrets-mgmt', label:'Secrets Management & Least Privilege', blurb:'No credential should be able to do more than its one job requires.',
        description:`Secrets management centralizes credentials in a system that rotates, audits, and revokes them, instead of scattering them in config files. Least privilege means every service, script, and human gets exactly the permissions their task needs — no more.`,
        why:`The real value of a secrets manager is rotation and audit — answering "which service used this credential, and can we rotate it in five minutes" is what limits damage during an incident.`,
        pitfall:`A CI/CD pipeline with a broad, long-lived deploy credential is one of the most common ways an entire production environment gets compromised through a single leaked token.` },
      { id:'threat-modeling', label:'Threat Modeling (STRIDE)', blurb:'Systematically asking "how would I attack this" before someone else does.',
        description:`STRIDE is a checklist for threat modeling a design: Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, and Elevation of Privilege. Walking a design through each category surfaces gaps a purely functional review misses.`,
        why:`Threat modeling in design review, before code is written, is dramatically cheaper than a penetration test finding the same gap after launch.` }
    ]
  },
  {
    id:'code-architecture', label:'Code-Level Architecture', hue:6,
    blurb:'The architecture decisions that live inside a single service.',
    description:`System design gets the attention, but a service's internal code architecture determines whether a design survives contact with six engineers modifying it over three years.`,
    children:[
      { id:'solid', label:'SOLID at Scale', blurb:"Principles that matter more as the codebase gets bigger, not less.",
        description:`Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion read like academic rules in a 200-line script — but they're the difference between a 50,000-line codebase that can still be safely changed and one where every change requires understanding the whole system first.`,
        why:`Dependency Inversion pays for itself fastest — depending on abstractions rather than concrete implementations is what makes a codebase testable and lets you swap a database or third-party API without a rewrite.` },
      { id:'coupling-cohesion', label:'Coupling & Cohesion', blurb:"The one metric that actually predicts how painful a change will be.",
        description:`Cohesion measures how related the responsibilities inside one module are — high cohesion means a module does one clear thing. Coupling measures how much modules depend on each other's internals — low coupling means you can change one without ripping through five others.`,
        analogy:`A well-organized toolbox, each drawer holding related tools, versus tools scattered so fixing one thing means digging through every drawer in the garage to find what depends on it.`,
        why:`When a "small" change touches ten files, that's a direct measurement of coupling — the single best leading indicator that a system needs refactoring before it needs more features.` },
      { id:'design-patterns', label:'Design Patterns That Actually Matter', blurb:'Not all 23 Gang-of-Four patterns earn their keep — a few do, constantly.',
        description:`Strategy (swap an algorithm at runtime behind a common interface) and Repository (hide data access behind a domain-shaped interface) show up in almost every well-architected service. Adapter (wrap a third-party API in your own interface) protects you the day that vendor changes their API. Observer/pub-sub decouples "something happened" from "here's everyone who cares" — the in-process ancestor of event-driven architecture.`,
        why:`The value isn't cleverness — each one draws a seam where a future change (swap the algorithm, the database, the vendor, add a listener) touches one place instead of everywhere that logic was duplicated.` },
      { id:'testing-strategy', label:'Testing Strategy', blurb:"The pyramid isn't dogma — it's a cost model.",
        description:`The test pyramid: many fast, cheap unit tests; fewer, slower integration tests; very few, slowest end-to-end tests. Contract tests sit in between — verifying a service's API matches what consumers actually expect, without every consumer running.`,
        why:`Excessive mocking is the pyramid's quiet failure mode — a suite full of unit tests that mock the database can pass 100% while the real system is broken, because the mock encodes an assumption that quietly went stale.`,
        pitfall:`Teams that mock the database in integration tests to make them "faster" often discover the mock and the real system diverged only when a production migration breaks something the mocked tests never could have caught.` },
      { id:'tech-debt', label:'Technical Debt as a Portfolio', blurb:"Not all debt is a mistake — some of it is a deliberate loan.",
        description:`Intentional debt is a conscious trade-off — "we'll hardcode this to hit the launch date, and we know it" — whose failure mode is forgetting to ever repay it. Accidental debt comes from not knowing better at the time, or the world changing under a design that was fine when made. Treating debt as a portfolio means repaying the highest-interest items first — the ones actively slowing every new feature — not the oldest or ugliest.`,
        why:`A principal engineer's most useful debt skill isn't avoiding it — it's making it legible to non-engineers, so paying it down competes for priority as a line item instead of staying invisible until it causes an outage.` }
    ]
  },
  {
    id:'judgment', label:'Principal Engineer Judgment', hue:7,
    blurb:"The architecture decisions that aren't really about the code.",
    description:`At the principal level, the hardest part of architecture is rarely the technology — it's building enough shared understanding across teams that the decision actually sticks.`,
    children:[
      { id:'adrs', label:'Architecture Decision Records', blurb:"Writing down not just what you decided, but why.",
        description:`An ADR is a short, permanent document capturing a significant decision: the context, the options considered, the choice made, and the trade-offs accepted. It's not a design doc — it's a decision receipt.`,
        why:`The ADR's real audience is future-you, six months from now, wondering "why on earth did we do it this way" — without one, that question gets answered by guessing or re-litigating the whole decision from scratch.` },
      { id:'reversible-decisions', label:'Reversible vs Irreversible Decisions', blurb:'One-way doors deserve deliberation; two-way doors deserve speed.',
        description:`A two-way door decision is cheap to reverse if wrong — try it, learn, adjust. A one-way door — a data model thousands of rows depend on, a public API contract, vendor lock-in — is expensive or impossible to undo. The skill is correctly classifying which kind of door you're walking through before deciding how much process it deserves.`,
        analogy:`Choosing a font for an internal tool is a screen door, barely worth a meeting. Choosing your primary datastore's partition key is a bank vault door, worth the extra week of design review.`,
        why:`The most common failure mode isn't a wrong call on a one-way door — it's spending one-way-door deliberation on a two-way-door decision, shipping nothing while the team waits for consensus that didn't need to happen.` },
      { id:'build-buy', label:'Build vs Buy vs Open Source', blurb:'Every line of code you own is a line you have to maintain forever.',
        description:`Building gives full control and zero license cost, but every future bug and feature is now your team's job forever. Buying trades that ongoing cost for a bill and a dependency on someone else's roadmap. Open source sits in between — no license cost, but usually still your operational burden to run and patch.`,
        why:`The question isn't "can we build this" — you almost always can — it's whether this is differentiated enough to justify the maintenance cost, or undifferentiated heavy lifting the team should buy so its attention goes to what matters to customers.` },
      { id:'cross-team-consensus', label:'Driving Cross-Team Consensus', blurb:"Technical authority doesn't come from title — it comes from a document everyone can argue with.",
        description:`An RFC puts a proposal in writing, with explicit trade-offs, inviting structured disagreement before implementation — turning hallway politics into a documented, addressable debate. A good design review protects the proposal from the loudest voice in the room, and protects the room from a design that skipped its hardest questions.`,
        why:`The RFC process's real value is forcing the proposer to write down the trade-offs they'd rather not think about — a design that can't survive being written down honestly usually shouldn't survive being built, either.` },
      { id:'strategy-horizon', label:'Technical Strategy Horizon', blurb:'Now, Next, Later — not every decision deserves the same certainty.',
        description:`"Now" work should be committed and precisely scoped. "Next" work should be directionally clear but not over-specified, because more will be learned before it starts. "Later" work should stay a bet, not a roadmap commitment — pretending to know exactly what you'll build in 18 months is usually just expensive fiction.`,
        why:`Roadmaps that specify "Later" with the same confidence as "Now" create a credibility problem the moment reality diverges — and it always diverges — which is why the horizon itself needs to be communicated, not just the content.` }
    ]
  }
];

/* ---------------- Runtime ---------------- */
const boardEl = document.getElementById('board');
const breadcrumbEl = document.getElementById('breadcrumb');
const drawerEl = document.getElementById('drawer');
const statsEl = document.getElementById('statsLine');
const searchInput = document.getElementById('searchInput');
const searchResultsEl = document.getElementById('searchResults');

const state = { path: [] };

function countNodes(nodes){
  let total = 0, leaves = 0;
  for(const n of nodes){
    total++;
    if(n.children && n.children.length){ const c = countNodes(n.children); total += c.total; leaves += c.leaves; }
    else leaves++;
  }
  return { total, leaves };
}
(function initStats(){
  const c = countNodes(DATA);
  statsEl.textContent = `${DATA.length} domains · ${c.total} concepts mapped · ${c.leaves} deep-dive endpoints`;
})();

function findChildById(nodes, id){ return nodes.find(n => n.id === id); }

function chainFromPath(path){
  const chain = [];
  let level = DATA;
  for(const id of path){
    const node = findChildById(level, id);
    if(!node) break;
    chain.push(node);
    level = node.children || [];
  }
  return chain;
}

function tierLabel(i){
  const tiers = ['Domain','Concept','Facet','Detail'];
  return tiers[Math.min(i, tiers.length - 1)];
}

function renderBoard(){
  boardEl.innerHTML = '';
  const chain = chainFromPath(state.path);
  const rootHue = chain.length ? chain[0].hue : null;

  renderColumn(DATA, 0, null);
  let level = DATA;
  for(let i = 0; i < chain.length; i++){
    const node = chain[i];
    if(node.children && node.children.length){
      renderColumn(node.children, i + 1, rootHue);
    }
    level = node.children || [];
  }
  renderBreadcrumb(chain, rootHue);
}

function renderColumn(nodes, colIndex, rootHue){
  const col = document.createElement('div');
  col.className = 'column';

  const head = document.createElement('div');
  head.className = 'column-head';
  head.innerHTML = `<span>${tierLabel(colIndex)}</span><span>${nodes.length} item${nodes.length===1?'':'s'}</span>`;
  col.appendChild(head);

  const list = document.createElement('div');
  list.className = 'column-list';

  if(!nodes.length){
    const empty = document.createElement('div');
    empty.className = 'column-empty';
    empty.textContent = 'No further branches — this is the end of this thread.';
    list.appendChild(empty);
  }

  nodes.forEach(node => {
    const hue = colIndex === 0 ? node.hue : rootHue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.style.setProperty('--cat', `var(--cat-${hue})`);
    if(state.path[colIndex] === node.id) btn.classList.add('selected');
    const hasChildren = node.children && node.children.length;
    btn.innerHTML = `
      <div class="card-row">
        <span class="card-label">${node.label}</span>
        ${hasChildren ? '<span class="card-chevron">›</span>' : ''}
      </div>
      <span class="card-blurb">${node.blurb}</span>
    `;
    btn.addEventListener('click', () => selectNode(colIndex, node, hue));
    list.appendChild(btn);
  });

  col.appendChild(list);
  boardEl.appendChild(col);
}

function selectNode(colIndex, node, hue){
  state.path = state.path.slice(0, colIndex);
  state.path.push(node.id);
  renderBoard();
  openDrawer(node, colIndex, hue);
  requestAnimationFrame(() => {
    boardEl.scrollTo({ left: boardEl.scrollWidth, behavior: 'smooth' });
  });
}

function renderBreadcrumb(chain, rootHue){
  breadcrumbEl.innerHTML = '';
  const home = document.createElement('button');
  home.type = 'button';
  home.className = 'crumb' + (chain.length === 0 ? ' current' : '');
  home.textContent = 'Overview';
  home.addEventListener('click', () => {
    state.path = [];
    renderBoard();
    closeDrawer();
    boardEl.scrollTo({ left: 0, behavior: 'smooth' });
  });
  breadcrumbEl.appendChild(home);

  chain.forEach((node, i) => {
    const sep = document.createElement('span');
    sep.className = 'crumb-sep';
    sep.textContent = '›';
    breadcrumbEl.appendChild(sep);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'crumb' + (i === chain.length - 1 ? ' current' : '');
    const dot = document.createElement('span');
    dot.className = 'crumb-dot';
    dot.style.background = `var(--cat-${i === 0 ? node.hue : rootHue})`;
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(node.label));
    btn.addEventListener('click', () => {
      state.path = state.path.slice(0, i + 1);
      renderBoard();
      openDrawer(node, i, rootHue);
    });
    breadcrumbEl.appendChild(btn);
  });
}

function openDrawer(node, colIndex, hue){
  const catVar = `var(--cat-${hue})`;
  document.getElementById('drawerTag').innerHTML =
    `<span class="drawer-dot" style="background:${catVar}"></span>${tierLabel(colIndex)}`;
  document.getElementById('drawerTitle').textContent = node.label;
  document.getElementById('drawerDesc').textContent = node.description || node.blurb;

  const analogyBox = document.getElementById('drawerAnalogyBox');
  if(node.analogy){ document.getElementById('drawerAnalogy').textContent = node.analogy; analogyBox.style.display = 'block'; analogyBox.style.setProperty('--cat', catVar); }
  else analogyBox.style.display = 'none';

  const whyBox = document.getElementById('drawerWhyBox');
  if(node.why){ document.getElementById('drawerWhy').textContent = node.why; whyBox.style.display = 'block'; whyBox.style.setProperty('--cat', catVar); }
  else whyBox.style.display = 'none';

  const pitfallBox = document.getElementById('drawerPitfallBox');
  if(node.pitfall){ document.getElementById('drawerPitfall').textContent = node.pitfall; pitfallBox.style.display = 'block'; }
  else pitfallBox.style.display = 'none';

  drawerEl.classList.add('open');
}
function closeDrawer(){ drawerEl.classList.remove('open'); }

document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.getElementById('resetBtn').addEventListener('click', () => {
  state.path = [];
  renderBoard();
  closeDrawer();
  boardEl.scrollTo({ left: 0, behavior: 'smooth' });
  searchInput.value = '';
  searchResultsEl.classList.remove('open');
});

/* ---------------- Search ---------------- */
let searchIndex = [];
(function buildIndex(){
  function walk(nodes, pathIds, pathLabels, rootHue){
    nodes.forEach(node => {
      const hue = rootHue === null ? node.hue : rootHue;
      const newPathIds = [...pathIds, node.id];
      const newPathLabels = [...pathLabels, node.label];
      searchIndex.push({ node, pathIds: newPathIds, pathLabels: newPathLabels, hue, colIndex: newPathIds.length - 1 });
      if(node.children && node.children.length) walk(node.children, newPathIds, newPathLabels, hue);
    });
  }
  walk(DATA, [], [], null);
})();

function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ searchResultsEl.classList.remove('open'); searchResultsEl.innerHTML=''; return; }
  const matches = searchIndex.filter(e =>
    e.node.label.toLowerCase().includes(q) || (e.node.blurb && e.node.blurb.toLowerCase().includes(q))
  ).slice(0, 8);

  searchResultsEl.innerHTML = '';
  if(!matches.length){
    const empty = document.createElement('div');
    empty.className = 'sr-empty';
    empty.textContent = 'No matches — try a shorter term.';
    searchResultsEl.appendChild(empty);
  } else {
    matches.forEach(m => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-result';
      btn.innerHTML = `<span class="sr-label">${m.node.label}</span><div class="sr-path">${m.pathLabels.slice(0, -1).join(' › ') || 'Domain'}</div>`;
      btn.addEventListener('click', () => {
        state.path = m.pathIds;
        renderBoard();
        openDrawer(m.node, m.colIndex, m.hue);
        searchResultsEl.classList.remove('open');
        searchInput.blur();
        requestAnimationFrame(() => boardEl.scrollTo({ left: boardEl.scrollWidth, behavior: 'smooth' }));
      });
      searchResultsEl.appendChild(btn);
    });
  }
  searchResultsEl.classList.add('open');
}

searchInput.addEventListener('input', e => runSearch(e.target.value));
searchInput.addEventListener('focus', e => { if(e.target.value) runSearch(e.target.value); });
document.addEventListener('click', e => {
  if(!e.target.closest('.search-box')) searchResultsEl.classList.remove('open');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ searchResultsEl.classList.remove('open'); closeDrawer(); }
});

renderBoard();
</script>
